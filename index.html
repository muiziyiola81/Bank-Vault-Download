<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Bank Vault — Secure Your Records</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #123b28 0%, #06100c 42%, #030806 100%);
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      text-align: center;
    }

    .logo {
      width: 92px;
      height: 92px;
      margin: 0 auto 22px;
      border-radius: 28px;
      background: linear-gradient(145deg, #173c2a, #091810);
      border: 1px solid #2d7651;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 800;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.45);
    }

    .badge {
      display: inline-block;
      padding: 7px 13px;
      margin-bottom: 18px;
      border-radius: 999px;
      background: rgba(29, 122, 77, 0.16);
      border: 1px solid rgba(75, 170, 116, 0.35);
      color: #8bd3a8;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 0.4px;
    }

    h1 {
      font-size: 42px;
      line-height: 1.05;
      margin-bottom: 14px;
      letter-spacing: -1px;
    }

    .subtitle {
      color: #aab8b1;
      line-height: 1.65;
      font-size: 16px;
      margin-bottom: 28px;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .feature {
      background: rgba(13, 33, 24, 0.72);
      border: 1px solid rgba(45, 118, 81, 0.35);
      border-radius: 16px;
      padding: 14px 8px;
    }

    .feature strong {
      display: block;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .feature span {
      color: #84958d;
      font-size: 11px;
    }

    .download {
      display: block;
      width: 100%;
      padding: 18px;
      border-radius: 16px;
      background: linear-gradient(135deg, #26945d, #176d45);
      color: white;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
      box-shadow: 0 12px 30px rgba(24, 112, 69, 0.28);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      margin-bottom: 14px;
    }

    .download:active {
      transform: scale(0.98);
    }

    .download:hover {
      box-shadow: 0 16px 36px rgba(24, 112, 69, 0.4);
    }

    .version {
      color: #718078;
      font-size: 13px;
      margin-bottom: 24px;
    }

    .footer {
      color: #53635c;
      font-size: 11px;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="logo">BV</div>

    <div class="badge">
      BANK VAULT • ANDROID
    </div>

    <h1>Bank Vault</h1>

    <p class="subtitle">
      A simple and organized way to manage your records in one place.
    </p>

    <div class="features">

      <div class="feature">
        <strong>Organized</strong>
        <span>Your records</span>
      </div>

      <div class="feature">
        <strong>Private</strong>
        <span>Your account</span>
      </div>

      <div class="feature">
        <strong>Simple</strong>
        <span>Easy to use</span>
      </div>

    </div>

    <a
      class="download"
      href="https://github.com/muiziyiola81/Bank-vault3/releases/download/v1.0/app-debug.apk"
    >
      Download Bank Vault
    </a>

    <p class="version">
      Version 1.0 • Android
    </p>

    <p class="footer">
      © 2026 Bank Vault
    </p>

  </main>

</body>
</html>
